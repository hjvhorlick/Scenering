<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://scenering.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <title>Scenering | Faceless Video Maker from Script to Video</title>
    <!-- Caption typefaces, first wave only: the handful of faces the default
         styles use, requested here so the first caption paints in the right
         font. The full catalogue (sixty-odd families, including the strange
         shelf) is injected at runtime by loadCaptionFonts() in
         src/data/caption-styles.ts, which marks its own links with
         data-caption-fonts-full. Do NOT give this link that attribute: the
         runtime loader skips its work when it finds one, and every face not
         listed below would quietly fall back to Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      data-caption-fonts="true"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Cormorant+Garamond:wght@400..700&family=Cinzel:wght@400..800&family=Inter:wght@400..800&family=Anton&family=Permanent+Marker&family=Caveat:wght@400..700&family=Monoton&family=Bangers&family=Baloo+2:wght@400..800&display=swap"
    />
    <meta
      name="description"
      content="Make faceless videos from scripts or prepared audio with Scenering. Build scenes, research visuals, add voiceover and synced captions, then edit and export for social platforms."
    />
    <meta name="author" content="Henry John Vincent Horlick" />
    <meta name="copyright" content="Copyright © 2026 Henry John Vincent Horlick. All rights reserved." />
    <meta name="theme-color" content="#0b2347" />
    <!-- Apply the saved UI theme before first paint to avoid a flash of the
         default theme. Kept in sync with src/lib/themes.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scenering_theme");
          if (!t || ["classic", "apple", "windows", "playful", "glass", "porcelain"].indexOf(t) === -1) t = "porcelain";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "porcelain");
        }
      })();
    </script>
    <!-- Absolute URLs are required by social-card crawlers, which do not run
         the SPA JavaScript. The card is built from Scenering's own artwork. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scenering" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://scenering.com/" />
    <meta property="og:title" content="Scenering | Faceless Video Maker from Script to Video" />
    <meta
      property="og:description"
      content="Make faceless videos from scripts or prepared audio. Build scenes, research visuals, add voiceover and synced captions, then edit and export for social platforms."
    />
    <meta property="og:image" content="https://scenering.com/marketing/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scenering turns scripts into scene-based faceless videos with researched visuals, voiceover and synced captions." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scenering | Faceless Video Maker from Script to Video" />
    <meta
      name="twitter:description"
      content="Make faceless videos from scripts or prepared audio. Build scenes, research visuals, add voiceover and synced captions, then edit and export for social platforms."
    />
    <meta name="twitter:image" content="https://scenering.com/marketing/og-card.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scenering",
        "url": "https://scenering.com/",
        "image": "https://scenering.com/marketing/og-card.jpg",
        "applicationCategory": "MultimediaApplication",
        "applicationSubCategory": "Video editing and script-to-video software",
        "operatingSystem": "Web browser",
        "description": "Create scene-based faceless videos from scripts or prepared audio. Research visuals, add narration and synced captions, edit the video, and export for social platforms.",
        "featureList": [
          "Script-to-scene planning",
          "Visual research and selection",
          "Speechify voiceover with a customer-provided API key",
          "Word-synced captions",
          "Video Studio editing and effects",
          "MP4 and WebM export"
        ],
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "url": "https://scenering.com/pricing" },
          { "@type": "Offer", "name": "SceneFlow monthly", "price": "19", "priceCurrency": "USD", "url": "https://scenering.com/pricing" },
          { "@type": "Offer", "name": "SceneFlow yearly", "price": "180", "priceCurrency": "USD", "url": "https://scenering.com/pricing" },
          { "@type": "Offer", "name": "SceneForge monthly", "price": "39", "priceCurrency": "USD", "url": "https://scenering.com/pricing" },
          { "@type": "Offer", "name": "SceneForge yearly", "price": "372", "priceCurrency": "USD", "url": "https://scenering.com/pricing" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
