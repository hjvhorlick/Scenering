<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenering - Script to Video Maker</title>
    <!-- Caption typefaces: formal, classical, artsy and fun faces used by the
         Captions studio. The renderer also injects this at runtime as a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      data-caption-fonts="true"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Cormorant+Garamond:wght@400..700&family=Cinzel:wght@400..800&family=Inter:wght@400..800&family=Anton&family=Permanent+Marker&family=Caveat:wght@400..700&family=Monoton&family=Bangers&family=Baloo+2:wght@400..800&display=swap"
    />
    <meta name="description" content="Script to video maker that generates scenes, image visuals, and narration previews." />
    <!-- Apply the saved UI theme before first paint to avoid a flash of the
         default theme. Kept in sync with src/lib/themes.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scenering_theme");
          if (!t || ["classic", "apple", "windows", "playful", "glass"].indexOf(t) === -1) t = "classic";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "classic");
        }
      })();
    </script>
    <meta property="og:title" content="Scenering - Script to Video Maker" />
    <meta property="og:description" content="Script to video maker that generates scenes, image visuals, and narration previews." />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
