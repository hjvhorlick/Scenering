<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="hPhCtRAdkEnwdSpyUQLsvXtHpBeZDrj7UouL7HJIMlk" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Search and link-preview tags: title, description, robots, canonical URL,
         Open Graph / X cards (the hero image) and structured data. They are
         written per page at build time from src/marketing/seo.ts by
         src/marketing/seo-head.ts (see vite.config.ts): dist/index.html gets the
         front page's, dist/pricing.html the pricing page's, and so on. Do not
         type tags here; edit the table in seo.ts. -->
    <!-- seo:start -->
    <!-- seo:end -->
    <!-- Caption typefaces, first wave only: the handful of faces the default
         styles use, requested here so the first caption paints in the right
         font. The full catalogue (sixty-odd families, including the strange
         shelf) is injected at runtime by loadCaptionFonts() in
         src/data/caption-styles.ts, which marks its own links with
         data-caption-fonts-full. Do NOT give this link that attribute: the
         runtime loader skips its work when it finds one, and every face not
         listed below would quietly fall back to Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      data-caption-fonts="true"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Cormorant+Garamond:wght@400..700&family=Cinzel:wght@400..800&family=Inter:wght@400..800&family=Anton&family=Permanent+Marker&family=Caveat:wght@400..700&family=Monoton&family=Bangers&family=Baloo+2:wght@400..800&display=swap"
    />
    <meta name="author" content="Henry John Vincent Horlick" />
    <meta name="copyright" content="Copyright © 2026 Henry John Vincent Horlick. All rights reserved." />
    <meta name="theme-color" content="#0b2347" />
    <!-- Apply the saved UI theme before first paint to avoid a flash of the
         default theme. Kept in sync with src/lib/themes.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scenering_theme");
          if (!t || ["classic", "apple", "windows", "playful", "glass", "porcelain"].indexOf(t) === -1) t = "classic";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "classic");
        }
      })();
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3303356901060479"
         crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"><!-- seo-page:start --><!-- seo-page:end --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
