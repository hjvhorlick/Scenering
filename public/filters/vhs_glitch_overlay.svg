<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Retro VHS Camcorder CRT Scanlines & Video Artifacts -->
  <defs>
    <!-- Dense CRT Scanlines Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1.5" fill="#000000" opacity="0.28" />
      <rect y="1.5" width="100%" height="2.5" fill="transparent" />
    </pattern>
    <!-- Tracking noise band -->
    <linearGradient id="noiseBand" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Horizontal Scanlines covering whole screen -->
  <rect width="1280" height="720" fill="url(#scanlines)" />

  <!-- VHS Tracking Jitter Strip near bottom -->
  <rect x="0" y="610" width="1280" height="24" fill="url(#noiseBand)" />
  <rect x="0" y="618" width="1280" height="2" fill="#00ffff" opacity="0.3" />
  <rect x="0" y="620" width="1280" height="2" fill="#ff0055" opacity="0.3" />

  <!-- Retro VHS Camcorder HUD (Top Left & Bottom Left) -->
  <g font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#facc15" opacity="0.8">
    <text x="40" y="55">PLAY ▶</text>
    <text x="120" y="55" font-size="14" fill="#ffffff" opacity="0.7">SP</text>
    <text x="40" y="670">AUTO  0:00:14</text>
    <text x="1110" y="670" fill="#ffffff" opacity="0.75">CH 03</text>
  </g>
</svg>