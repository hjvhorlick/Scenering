<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Silver Gelatin Cinematic Noir Dramatic Vignette -->
  <defs>
    <radialGradient id="noirVignette" cx="50%" cy="50%" r="62%">
      <stop offset="25%" stop-color="#000000" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </radialGradient>
  </defs>

  <!-- Deep Shadow Vignette Frame -->
  <rect width="1280" height="720" fill="url(#noirVignette)" />

  <!-- Subtle Film Grain Specks -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="210" cy="190" r="1.2" />
    <circle cx="560" cy="310" r="1.4" />
    <circle cx="890" cy="240" r="1.1" />
    <circle cx="430" cy="510" r="1.5" />
    <circle cx="1020" cy="460" r="1.3" />
    <circle cx="780" cy="140" r="1.1" />
  </g>
</svg>