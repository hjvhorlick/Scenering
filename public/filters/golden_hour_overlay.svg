<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Radiant Sunset Golden Hour Warm Light Overlay -->
  <defs>
    <linearGradient id="goldenGradient" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.28" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#goldenGradient)" style="mix-blend-mode: color;" />
  <rect width="1280" height="720" fill="url(#sunGlow)" />
</svg>