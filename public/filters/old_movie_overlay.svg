<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Old 1930s Movie Overlay: Scratches, Dust Specks, Vignette & Sepia Wash -->
  <defs>
    <!-- Heavy Projector Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="35%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#190e06" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0c0703" stop-opacity="0.75" />
    </radialGradient>
    <!-- Warm Sepia Tone -->
    <linearGradient id="sepiaWash" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#7c5324" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#543714" stop-opacity="0.28" />
    </linearGradient>
    <filter id="blurSoft">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Sepia Tint Wash -->
  <rect width="1280" height="720" fill="url(#sepiaWash)" style="mix-blend-mode: color;" />
  <rect width="1280" height="720" fill="url(#vignette)" />

  <!-- Vertical Film Scratches -->
  <g opacity="0.32" stroke="#ffffff" stroke-width="0.75">
    <line x1="184" y1="0" x2="182" y2="720" />
    <line x1="512" y1="0" x2="515" y2="720" opacity="0.5" />
    <line x1="890" y1="0" x2="888" y2="720" />
    <line x1="1104" y1="0" x2="1106" y2="720" stroke="#120c08" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Dust Spots & Hair Curl -->
  <g opacity="0.45" fill="#181109">
    <circle cx="210" cy="140" r="3" />
    <circle cx="213" cy="144" r="1.5" />
    <circle cx="740" cy="480" r="2.5" />
    <circle cx="980" cy="220" r="3.5" />
    <circle cx="430" cy="610" r="2" />
    <circle cx="620" cy="110" r="1.8" />
    <!-- Hair fiber curl -->
    <path d="M740 480 Q745 470 752 473 T760 482" fill="none" stroke="#181109" stroke-width="1.2" stroke-linecap="round" />
    <path d="M310 290 Q314 282 320 286" fill="none" stroke="#22180e" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <!-- Light Dust Specks (White) -->
  <g opacity="0.3" fill="#ffffff">
    <circle cx="380" cy="90" r="1.5" />
    <circle cx="820" cy="340" r="2" />
    <circle cx="1060" cy="590" r="1.8" />
    <circle cx="150" cy="620" r="2" />
    <circle cx="670" cy="210" r="1.2" />
  </g>
</svg>