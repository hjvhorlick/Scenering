<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Hollywood Blockbuster Teal & Orange Cinematic Tone Grade -->
  <defs>
    <linearGradient id="tealOrange" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="cinVignette" cx="50%" cy="50%" r="65%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#tealOrange)" style="mix-blend-mode: color;" />
  <rect width="1280" height="720" fill="url(#cinVignette)" />
</svg>