<!doctype html><html><meta charset="utf-8"><title>Scenering wordmark on video</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;padding:28px;background:#f7f5f2;color:#22304a;
      font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,sans-serif}
 h1{font:600 26px/1.2 Georgia,serif;margin:0 0 4px}
 p.s{margin:0 0 24px;color:#6a7793;max-width:62ch}
 .row{display:flex;flex-wrap:wrap;gap:18px}
 figure{margin:0;background:#fff;border:1px solid #e8e2d9;border-radius:16px;padding:14px;
        box-shadow:0 4px 14px rgba(24,33,48,.06)}
 figcaption{font-size:11.5px;font-weight:600;color:#54617c;margin-top:9px;text-align:center}
 canvas{display:block;border-radius:10px}
</style>
<h1>The wordmark, drawn into the video</h1>
<p class="s">The real <code>drawBrandWordmark()</code> from <code>src/lib/render-effects.ts</code>,
over frames the way an export composites it. Scale with the frame, no image decode, sharp at any resolution.</p>
<div class="row" id="row"></div>
<script type="module">
import { drawBrandWordmark } from "./brand-mark.mjs";
const shots = [
  { w:420, h:236, size:34, bg:["#12325e","#0a1a38"], cap:"On a dark frame" },
  { w:420, h:236, size:34, bg:["#d9c3a0","#8c6f4d"], cap:"On a bright frame" },
  { w:260, h:462, size:26, bg:["#264d34","#0f2a1c"], cap:"9:16, smaller" },
  { w:420, h:236, size:34, bg:["#3a2a48","#170f22"], cap:"Someone else's brand — one colour", text:"NORTHWIND" },
];
for (const s of shots) {
  const f = document.createElement("figure");
  const c = document.createElement("canvas");
  c.width = s.w*2; c.height = s.h*2; c.style.width = s.w+"px"; c.style.height = s.h+"px";
  const x = c.getContext("2d"); x.scale(2,2);
  const g = x.createLinearGradient(0,0,s.w,s.h);
  g.addColorStop(0,s.bg[0]); g.addColorStop(1,s.bg[1]);
  x.fillStyle=g; x.fillRect(0,0,s.w,s.h);
  x.globalAlpha=.16; x.fillStyle="#fff";
  for(let i=0;i<9;i++){x.beginPath();x.arc(Math.random()*s.w,Math.random()*s.h,Math.random()*34+8,0,7);x.fill();}
  x.globalAlpha=1;
  x.save(); x.translate(s.w/2, s.h*0.82);
  drawBrandWordmark(x, s.text || "Scenering", s.size);
  x.restore();
  f.appendChild(c);
  const cap = document.createElement("figcaption"); cap.textContent = s.cap; f.appendChild(cap);
  document.getElementById("row").appendChild(f);
}
</script></html>
